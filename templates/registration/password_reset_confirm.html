{% extends 'base.html' %}

{% block content %}
<div class="card auth-card">
    <h1>Choisir un nouveau mot de passe</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="field">
            <label for="id_new_password1">Nouveau mot de passe</label>
            {{ form.new_password1 }}
            {{ form.new_password1.errors }}
        </div>

        <div class="field">
            <label for="id_new_password2">Confirmation</label>
            {{ form.new_password2 }}
            {{ form.new_password2.errors }}
        </div>

        <button type="submit" class="primary-button">Réinitialiser</button>
    </form>
</div>
{% endblock %}
